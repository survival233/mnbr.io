# Manebra — Render blueprint
#
# Shopper (shopper-agent): Relay chat pipe
# Traveler (traveler-agent): separate service
#
# Shopper folder is apps/shopper-agent. Keep the live Render service name
# `manebra-linq-agent` so https://manebra-linq-agent.onrender.com stays stable
# for existing Relay agents. Do not rename the cloud hostname in this pass.
#
# One Render Postgres for the marketplace. Both agents get the same
# DATABASE_URL (internal connection string). Do not put the URL in git.
databases:
  - name: manebra-marketplace
    region: oregon
    plan: basic-256mb

services:
  - type: web
    name: manebra-linq-agent
    runtime: node
    plan: starter
    region: oregon
    buildCommand: npm install --include=dev && npm run db:generate
    startCommand: npm run shopper-agent
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: LINQ_FROM_PHONE
        sync: false
      - key: LINQ_API_KEY
        sync: false
      - key: LINQ_WEBHOOK_SECRET
        sync: false
      - key: RELAY_AGENT_TOKEN
        sync: false
      - key: RELAY_WEBHOOK_SECRET
        sync: false
      - key: SERPAPI_API_KEY
        sync: false
      - key: HF_TOKEN
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: LLM_PROVIDER
        value: openai
      - key: SETTLEMENT_ENABLED
        value: "0"
      - key: DATABASE_URL
        fromDatabase:
          name: manebra-marketplace
          property: connectionString
      - key: DIRECT_URL
        fromDatabase:
          name: manebra-marketplace
          property: connectionString
      - key: AGENTCARD_CLIENT_ID
        sync: false
      - key: AGENTCARD_CLIENT_SECRET
        sync: false
      - key: AGENTCARD_WEBHOOK_SECRET
        sync: false

  - type: web
    name: manebra-traveler-agent
    runtime: node
    plan: starter
    region: oregon
    buildCommand: npm install --include=dev && npm run db:generate
    startCommand: npm run traveler-agent
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: LINQ_FROM_PHONE
        sync: false
      - key: LINQ_API_KEY
        sync: false
      - key: LINQ_WEBHOOK_SECRET
        sync: false
      - key: SERPAPI_API_KEY
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: manebra-marketplace
          property: connectionString
      - key: DIRECT_URL
        fromDatabase:
          name: manebra-marketplace
          property: connectionString
      - key: AGENTCARD_CLIENT_ID
        sync: false
      - key: AGENTCARD_CLIENT_SECRET
        sync: false
      - key: AGENTCARD_WEBHOOK_SECRET
        sync: false
      # Commerce SDK (Vector C) — dashboard-managed. Leave ENABLED unset to keep
      # the surface off (legacy buy path). Turn it on ONLY with Commerce SDK
      # SANDBOX credentials in AGENTCARD_CLIENT_ID/SECRET (npx agent-cards
      # credentials --mode sandbox); live credentials place real orders.
      - key: COMMERCE_SDK_ENABLED
        sync: false
      - key: COMMERCE_SDK_MODE
        sync: false
      - key: AGENTCARD_COMMERCE_BASE_URL
        sync: false
      - key: FLIGHTS_ALLOW_DEMO
        value: "1"
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REDIRECT_URI
        value: "https://manebra-traveler-agent.onrender.com/oauth/google/callback"
      - key: PUBLIC_BASE_URL
        value: "https://manebra-traveler-agent.onrender.com"
      # Optional later — Relay chat pipe
      - key: RELAY_AGENT_TOKEN
        sync: false
      - key: RELAY_WEBHOOK_SECRET
        sync: false
