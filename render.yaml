# Manebra — Render blueprint (Linq always-on agent)
#
# After first deploy, create the permanent webhook:
#   linq webhooks create \
#     --url "https://<service>.onrender.com/webhooks/linq?version=2026-02-03" \
#     --events message.received --json
# Then set LINQ_WEBHOOK_SECRET from the response.
services:
  - type: web
    name: manebra-linq-agent
    runtime: node
    plan: starter
    region: oregon
    buildCommand: npm install --include=dev && npm run db:generate
    startCommand: npm run linq-agent
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: LINQ_FROM_PHONE
        sync: false
      - key: LINQ_API_KEY
        sync: false
      - key: LINQ_WEBHOOK_SECRET
        sync: false
      - key: SERPAPI_API_KEY
        sync: false
      - key: HF_TOKEN
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: LLM_PROVIDER
        value: hf
      - key: SETTLEMENT_ENABLED
        value: "0"
      - key: DATABASE_URL
        sync: false
